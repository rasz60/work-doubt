<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* 앱 바탕(기록판 회색). 다크 모드는 남색 */
      body { background: #eef0f3; }
      @media (prefers-color-scheme: dark) { body { background: #0e1218; } }
    </style>
    <!-- 한글 글꼴: 포털과 같은 Pretendard (웹에서만, theme.ts 의 fonts.sans) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)" />
    <!-- 첫 화면 로딩: ae:p 포털의 로딩 화면(ae2p shared/loader.ts)과 같은 모양. 포털에서 넘어올 때 화면이 끊기지 않게 -->
    <style>.aep-ld { position: fixed; inset: 0; z-index: 2147483646; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f6f5fb; color: #7b7f95; font: 14px/1.4 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: .02em; animation: aep-ld-in .2s ease-out both; --px-ink: #1e1e1e; } .aep-ld p { margin: 0; } .aep-ld-logo { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 14px 34px -14px rgb(90 80 200 / .45); animation: aep-ld-pop .45s cubic-bezier(.2, 1.4, .4, 1) both; } .aep-ld-logo svg { width: var(--logo); height: auto; display: block; } .aep-ld-work { background: #efe9ff; } .aep-ld-project { background: #e3eeff; } .aep-ld-health { background: #e0f5ea; } .aep-ld-interest { background: #fdeae2; } .aep-ld-ae { width: 58px; height: auto; overflow: visible; } .aep-ld-ae path { transform-box: fill-box; transform-origin: center bottom; animation: aep-ld-hop .9s ease-in-out infinite; } .aep-ld-ae .e { animation-delay: .18s; } .aep-ld-solo .aep-ld-ae { width: 96px; } @keyframes aep-ld-in { from { opacity: 0; } } @keyframes aep-ld-pop { from { transform: scale(.6); opacity: 0; } } @keyframes aep-ld-hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(-16px) scale(.96, 1.04); } 45% { transform: translateY(0) scale(1.06, .92); } } @media (prefers-color-scheme: dark) { .aep-ld { background: #14152a; color: #9a9cb8; --px-ink: #a7b6bd; } .aep-ld-work { background: #2d2652; } .aep-ld-project { background: #1d2f55; } .aep-ld-health { background: #183a2b; } .aep-ld-interest { background: #43281f; } } @media (prefers-reduced-motion: reduce) { .aep-ld, .aep-ld-logo, .aep-ld-ae path { animation: none; } }</style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div class="aep-ld" role="status" aria-label="운동기록 여는 중"><div class="aep-ld-logo aep-ld-health" style="--logo:100%"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#0b0b0b"/><polyline points="5.5,15.5 9.5,11.5 12.5,14 17,8.5 18.8,10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><svg class="aep-ld-ae" viewBox="4 4 200 112" aria-hidden="true"><defs><linearGradient id="aep-ld-grad" gradientUnits="userSpaceOnUse" x1="8" y1="40" x2="200" y2="90"><stop offset="0" stop-color="#4E8BFF"/><stop offset=".5" stop-color="#7A82FF"/><stop offset="1" stop-color="#D47CF2"/></linearGradient></defs><g fill="none" stroke="url(#aep-ld-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path class="a" d="M24 60a36 36 0 1 0 72 0a36 36 0 1 0 -72 0M96 42V96"/><path class="e" d="M111 60H183A36 36 0 1 0 163.9 91.79"/></g></svg><p>운동기록 여는 중…</p></div></div>
    <!-- ae:p 앱 전환 버튼 (포털이 /shell/switcher.js 로 제공). 아래 탭 바와 겹치지 않게 오른쪽 위 -->
    <aep-switcher position="top-right" offset="12"></aep-switcher>
    <script type="module" src="/shell/switcher.js"></script>
  </body>
</html>
