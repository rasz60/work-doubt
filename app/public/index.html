<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* 앱 바탕(흰 종이). 다크 모드는 검정 — src/theme.ts 의 paper */
      body { background: #ffffff; }
      @media (prefers-color-scheme: dark) { body { background: #000000; } }
    </style>
    <!-- 한글 글꼴: 포털과 같은 Pretendard (웹에서만, theme.ts 의 fonts.sans) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- 첫 화면 로딩: ae:p 포털의 로딩 화면(ae2p shared/loader.ts)과 같은 모양. 포털에서 넘어올 때 화면이 끊기지 않게 -->
    <style>.aep-ld { position: fixed; inset: 0; z-index: 2147483646; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f3f4f2; color: #565d66; font: 14px/1.4 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; letter-spacing: .02em; animation: aep-ld-in .2s ease-out both; --px-ink: #1e1e1e; } .aep-ld p { margin: 0; } .aep-ld-logo { width: 88px; height: 88px; border-radius: 20px; display: grid; place-items: center; overflow: hidden; animation: aep-ld-pop .28s cubic-bezier(.23, 1, .32, 1) both; } .aep-ld-logo svg { width: var(--logo); height: auto; display: block; } .aep-ld-work { background: #e6ecf8; } .aep-ld-project { background: #dff0f2; } .aep-ld-health { background: #e2f1e8; } .aep-ld-interest { background: #f8e7de; } .aep-ld-ae { width: 58px; height: auto; overflow: visible; color: #0a7d5a; } .aep-ld-ae path { transform-box: fill-box; transform-origin: center bottom; animation: aep-ld-hop .9s ease-in-out infinite; } .aep-ld-ae .e { animation-delay: .18s; } .aep-ld-solo .aep-ld-ae { width: 96px; } @keyframes aep-ld-in { from { opacity: 0; } } @keyframes aep-ld-pop { from { transform: scale(.92); opacity: 0; } } @keyframes aep-ld-hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(-16px) scale(.96, 1.04); } 45% { transform: translateY(0) scale(1.06, .92); } } @media (prefers-color-scheme: dark) { .aep-ld { background: #111418; color: #a2a9b3; --px-ink: #a7b6bd; } .aep-ld-ae { color: #3dbb92; } .aep-ld-work { background: #232c40; } .aep-ld-project { background: #1a3236; } .aep-ld-health { background: #1b3326; } .aep-ld-interest { background: #3d261c; } } @media (prefers-reduced-motion: reduce) { .aep-ld, .aep-ld-logo, .aep-ld-ae path { animation: none; } }</style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div class="aep-ld" role="status" aria-label="운동기록 여는 중"><div class="aep-ld-logo aep-ld-health" style="--logo:100%"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" fill="#0b0b0b"/><polyline points="5.5,15.5 9.5,11.5 12.5,14 17,8.5 18.8,10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><svg class="aep-ld-ae" viewBox="4 4 200 112" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path class="a" d="M24 60a36 36 0 1 0 72 0a36 36 0 1 0 -72 0M96 42V96"/><path class="e" d="M111 60H183A36 36 0 1 0 163.9 91.79"/></g></svg><p>운동기록 여는 중…</p></div></div>
    <!-- ae:p 앱 전환 버튼 (포털이 /shell/switcher.js 로 제공). 아래 탭 바와 겹치지 않게 오른쪽 위 -->
    <aep-switcher position="top-right" offset="12"></aep-switcher>
    <script type="module" src="/shell/switcher.js"></script>
  </body>
</html>
